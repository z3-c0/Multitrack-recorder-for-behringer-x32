<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Multitrack Recorder</title>

    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>

<body>

<div class="phone">

    <!-- ============ RECORD VIEW ============ -->
    <div class="view active" id="view-record">
        <div class="topbar">
            <button class="icon-btn" id="settingsBtn" title="Settings">&#9881;</button>
            <div class="title"><span class="status-dot" id="statusDot"></span>Records</div>
            <button class="icon-btn" id="recordingsBtn" title="Recordings">&#9776;</button>
        </div>

        <div class="mic-wrap">
            <button class="mic-btn" id="micBtn">&#127908;</button>
        </div>

        <div class="timer-text" id="timerText">0:00</div>
        <div class="record-hint" id="recordHint">Tap to record</div>

        <div class="waveform" id="recordWaveform"></div>

        <div class="record-controls hidden" id="recordControls">
            <button class="circle-btn discard" id="discardBtn" title="Discard">&#10005;</button>
            <button class="circle-btn finish" id="finishBtn" title="Finish">&#10003;</button>
        </div>
    </div>

    <!-- ============ RECORDINGS VIEW ============ -->
    <div class="view" id="view-recordings">
        <div class="topbar">
            <button class="icon-btn" id="backBtn" title="Back">&#8592;</button>
            <div class="title"><span class="status-dot" id="statusDotRecordings"></span>Recordings</div>
        </div>

        <div class="search-input-wrap">
            <span class="search-icon">&#128269;</span>
            <input type="text" id="searchInput" placeholder="Search recordings...">
        </div>

        <div class="recordings-scroll" id="recordingsList"></div>
    </div>

</div>

<!-- ============ SETTINGS MODAL ============ -->
<div class="modal fade" id="settingsModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h5 class="modal-title">Settings</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="settings-row">
                    <span>Connection</span>
                    <span class="value" id="settingsConnected">-</span>
                </div>
                <div class="settings-row">
                    <span>Device</span>
                    <span class="value" id="settingsDeviceModel">-</span>
                </div>
                <div class="settings-row">
                    <span>Storage free</span>
                    <span class="value" id="settingsFree">-</span>
                </div>
                <div class="settings-row">
                    <span>Storage total</span>
                    <span class="value" id="settingsTotal">-</span>
                </div>
                <div class="settings-row">
                    <span>Current path</span>
                    <span class="value" id="settingsPath">-</span>
                </div>

                <hr class="border-secondary">

                <label class="form-label small text-light">Storage location</label>
                <select id="storageSelect" class="form-select"></select>
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<!-- ============ RENAME MODAL ============ -->
<div class="modal fade" id="renameModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h5 class="modal-title">Rename Recording</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input id="renameInput" class="form-control" placeholder="New filename">
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-warning" id="confirmRenameBtn">Rename</button>
            </div>
        </div>
    </div>
</div>

<!-- ============ DELETE CONFIRM MODAL ============ -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h5 class="modal-title text-danger">Delete Recording</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="mb-0">Are you sure you want to delete this recording? This cannot be undone.</p>
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
            </div>
        </div>
    </div>
</div>

<!-- ============ ERROR MODAL ============ -->
<div class="modal fade" id="errorModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h5 class="modal-title text-danger">Error</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p id="errorMessage"></p>
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">OK</button>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/socket.io.min.js"></script>
<script src="/static/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>

</body>
</html>
