<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Multitrack Recorder</title>

    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <script src="/static/js/socket.io.min.js"></script>
    <script src="/static/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background: #0f172a;
            color: #ffffff;
        }
        .card {
            background: #1f2937;
            border: none;
            border-radius: 14px;
        }
        .action-btn {
            width: 100%;
            height: 50px;
        }
        h3, h5 {
            color: #ffffff;
        }

        .action-btn {
            width: 100%;
            height: 52px;
            font-weight: 500;
        }
        #status {
            color: #ffffff;
            font-size: 16px;
            font-weight: 500;
            line-height: 1.6;
        }
        small {
            color: #ffffff !important;
            font-weight: 500;
        }
        #curTime, #durTime {
            color: #ffffff;
            font-weight: 600;
        }
    </style>
</head>

<body>
<div class="container py-4">

    <h3 class="mb-4">🎛 Multitrack Console Recorder</h3>

    <!-- STATUS -->
    <div class="card p-3 mb-4">
        <div id="status">Connecting...</div>
    </div>

    <!-- RECORDING -->
    <div class="card p-3 mb-4">
        <h5 id="recordingText">Recording</h5>

        <div class="row g-3 mt-1">
            <div class="col-12">
                <button id="recordBtn" class="btn btn-danger action-btn" onclick="toggleRecord()">
                    ● Record
                </button>
            </div>

            <div class="mt-3">
                <small>Time: <span id="recTime">0:0</span>s</small>
            </div>
        </div>
    </div>

    <!-- PLAYBACK + MANAGE -->
    <div class="card p-3">
        <h5>Playback & File Management</h5>

        <select id="fileSelect" class="form-select mb-3"></select>

        <div class="d-flex justify-content-between">
            <small id="curTime">0:00</small>
            <small id="durTime">0:00</small>
        </div>
        
        <input type="range" class="form-range mb-3" id="seekbar" min="0" max="100" value="0">

        <div class="row g-3">
            <div class="col-6">
                <button id="playBtn" class="btn btn-success action-btn" onclick="togglePlay()">▶ Play</button>
            </div>
            <div class="col-6">
                <button class="btn btn-secondary action-btn" onclick="stopPlay()">■ Stop</button>
            </div>
            <div class="col-6">
                <button class="btn btn-warning action-btn" data-bs-toggle="modal" data-bs-target="#renameModal">
                    Rename
                </button>
            </div>
            <div class="col-6">
                <button class="btn btn-outline-danger action-btn" onclick="deleteFile()">
                    Delete
                </button>
            </div>
        </div>
    </div>

</div>

<!-- RENAME MODAL -->
<div class="modal fade" id="renameModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content bg-dark text-light">
            <div class="modal-header border-0">
                <h5 class="modal-title">Rename File</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input id="renameInput" class="form-control" placeholder="New filename">
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-warning" onclick="confirmRename()">Rename</button>
            </div>
        </div>
    </div>
</div>



<!-- ERROR MODAL -->
<div class="modal fade" id="errorModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-light">
            <div class="modal-header border-0">
                <h5 class="modal-title text-danger">Error</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p id="errorMessage"></p>
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">
                    OK
                </button>
            </div>
        </div>
    </div>
</div>










<script>
    const socket = io();
    let recording = false;
    let playing = false;
    let duration = 0;
    let position = 0;
    let paused = false;
    const seekbar = document.getElementById("seekbar");
    const statusDiv = document.getElementById("status");
    const recordingText = document.getElementById("recordingText");
    const fileSelect = document.getElementById("fileSelect");
    const renameModal = new bootstrap.Modal(document.getElementById('renameModal'));

    // ---------- SOCKET LISTENERS ----------

    socket.on("status", (data) => {
        paused = !!data.paused;
        recording = !!data.recording;
        playing = !!data.playing;
        duration = data.duration || 0;
        position = data.position || 0;
        device_model = data.device_model;
        statusDiv.innerHTML = data.connected ? device_model + " ✅ Connected" : "Console ❌ Not Found"
    
        // ---- RECORD BUTTON ----
        const recBtn = document.getElementById("recordBtn");
        if (recording) {
            recordingText.innerText = 'Recording in progress...';
            recordingText.style = 'color:red';
            recBtn.classList.remove("btn-danger");
            recBtn.classList.add("btn-secondary");
            recBtn.innerText = "■ Stop Recording";
        } else {
            recordingText.innerText = 'Recording';
            recordingText.style = '';
            recBtn.classList.add("btn-danger");
            recBtn.classList.remove("btn-secondary");
            recBtn.innerText = "● Record";
        }
    
        document.getElementById("recTime").innerText =
            (data.record_time || 0).toFixed(1);
    
        // ---- PLAY BUTTON ----
        const playBtn = document.getElementById("playBtn");
        if (playing) {
            if (data.paused) {
                playBtn.classList.remove("btn-warning");
                playBtn.classList.add("btn-success");
                playBtn.innerText = "▶ Resume";
            } else {
                playBtn.classList.remove("btn-success");
                playBtn.classList.add("btn-warning");
                playBtn.innerText = "⏸ Pause";
            }
        } else {
            playBtn.classList.add("btn-success");
            playBtn.classList.remove("btn-warning");
            playBtn.innerText = "▶ Play";
        }
    
        // ---- SEEK BAR ----
        const seek = document.getElementById("seekbar");
    
        if (!isSeeking) {
            seek.max = data.duration || 0;
            seek.value = data.playing ? data.position : 0;
        }
    
        document.getElementById("curTime").innerText = formatTime(data.position);
        document.getElementById("durTime").innerText = formatTime(data.duration);
    });
    socket.on("position", (data) => {
        if (!playing || paused) return;
        if (isSeeking) return;
    
        position = data.position;
        duration = data.duration;
    
        seekbar.max = duration;
        seekbar.value = position;
    
        document.getElementById("curTime").innerText = formatTime(position);
        document.getElementById("durTime").innerText = formatTime(duration);
    });
    
    socket.on("files", (files) => {
        const current = fileSelect.value;
        fileSelect.innerHTML = "";

        files.forEach(f => {
            const opt = document.createElement("option");
            opt.value = f;
            opt.text = f;
            fileSelect.appendChild(opt);
        });

        if (files.includes(current)) fileSelect.value = current;
    });

    // ---------- ACTIONS ----------

    socket.on("resume_required", () => {
        socket.emit("resume_play");
    });

    function toggleRecord() {
        if (recording) {
            socket.emit("stop_record");
        }else{
            socket.emit("start_record");
        } 
    }
    function togglePlay() {
        if (!playing) {
            socket.emit("play", {file: fileSelect.value});
        } else if (paused) {
            socket.emit("pause_play"); // resume
        } else {
            socket.emit("pause_play"); // pause
        }
    }

    function stopPlay() {
        socket.emit("stop_play");
    }

    function confirmRename() {
        const newName = document.getElementById("renameInput").value;
        if (!newName) return;

        socket.emit("rename", {
            old: fileSelect.value,
            new: newName
        });

        document.getElementById("renameInput").value = "";
        renameModal.hide();
    }

    function deleteFile() {
        if (!confirm("Delete file?")) return;

        socket.emit("delete", {
            file: fileSelect.value
        });
    }

    // ------------ ERROR ACTIONS -----------


    const errorModal = new bootstrap.Modal(document.getElementById('errorModal'));
    const errorMessage = document.getElementById('errorMessage');

    socket.on("app_error", (data) => {
        console.log(' ERROR received:', data);
        showErrorModal(data.msg);
    });

    function showErrorModal(message) {
        errorMessage.textContent = message;
        errorModal.show();
    }


    let isSeeking = false;
    
    seekbar.addEventListener("mousedown", () => isSeeking = true);
    seekbar.addEventListener("touchstart", () => isSeeking = true);
    
    seekbar.addEventListener("mouseup", () => {
        socket.emit("seek", {pos: seekbar.value});
        isSeeking = false;
    });
    
    seekbar.addEventListener("touchend", () => {
        socket.emit("seek", {pos: seekbar.value});
        isSeeking = false;
    });
    
    function formatTime(sec) {
        sec = Math.floor(sec || 0);
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${m}:${s.toString().padStart(2,"0")}`;
    }
</script>

</body>
</html>
