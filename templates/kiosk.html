<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Multitrack Recorder - Kiosk</title>

    <link href="/static/css/kiosk.css" rel="stylesheet">
</head>

<body>

<div class="kiosk">

    <div class="kiosk-left">
        <div class="kiosk-conn-row">
            <span class="conn-dot" id="connDot"></span>
            <span class="conn-text" id="connText">Connecting...</span>
        </div>

        <div class="device-label" id="deviceLabel">Console: —</div>

        <div class="pills-row">
            <div class="pill">
                <div class="pill-title">RECORDING</div>
                <div class="pill-value" id="recPillValue">—</div>
            </div>
            <div class="pill">
                <div class="pill-title">PLAYBACK</div>
                <div class="pill-value" id="playPillValue">—</div>
            </div>
            <div class="pill">
                <div class="pill-title">STORAGE</div>
                <div class="pill-value" id="storagePillValue">—</div>
            </div>
        </div>
    </div>

    <div class="kiosk-right">
        <div class="section-title">RECORDINGS</div>
        <div class="kiosk-file-list" id="fileList"></div>
    </div>

</div>

<script src="/static/js/socket.io.min.js"></script>
<script src="/static/js/kiosk.js"></script>

</body>
</html>
